<label class="stepper" data-stepper
  >份數：
  <input class="field" type="number" min="1" max="99" value="2" />
  <span class="stepper-buttons">
    <button type="button" data-step="1" aria-label="增加">
      <svg
        width="8"
        height="5"
        viewBox="0 0 8 5"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M1 4 4 1l3 3" />
      </svg>
    </button>
    <button type="button" data-step="-1" aria-label="減少">
      <svg
        width="8"
        height="5"
        viewBox="0 0 8 5"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="m1 1 3 3 3-3" />
      </svg>
    </button>
  </span>
</label>
