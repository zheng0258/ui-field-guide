<label class="stepper" data-stepper>
  數量
  <input type="number" min="0" max="10" value="2" readonly />
  <span class="stepper-buttons">
    <button type="button" data-step="-1" aria-label="減少">
      <svg
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M2 8h12" />
      </svg>
    </button>
    <button type="button" data-step="1" aria-label="增加">
      <svg
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M8 2v12M2 8h12" />
      </svg>
    </button>
  </span>
</label>
