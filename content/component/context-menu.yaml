id: context-menu
kind: component
name: { en: Context menu, zh: 情境選單 }
aliases: [right-click menu, shortcut menu, long-press menu, 右鍵選單, 長按選單]
describe:
  - 按右鍵或長按才會跳出來的選單
  - 針對你點的那個東西列出能做的事
category: overlays
confusedWith: [pull-down-menu]
platforms:
  macos:
    name: Context menu
    api: { appkit: 'NSMenu (NSView.menu)', swiftui: '.contextMenu' }
    guideline: https://developer.apple.com/design/human-interface-guidelines/context-menus
  ios:
    name: Context menu
    api: { uikit: UIContextMenuInteraction, swiftui: '.contextMenu' }
    guideline: https://developer.apple.com/design/human-interface-guidelines/context-menus
  android:
    name: Context menu
    api: { compose: 'DropdownMenu (on long press)', view: 'View.OnCreateContextMenuListener' }
    guideline: https://developer.android.com/develop/ui/views/components/menus
  web:
    name: Context menu
    api: { html: 'contextmenu event', aria: menu }
    guideline: https://www.w3.org/WAI/ARIA/apg/patterns/menubar/
prompt:
  keywords: [context menu, right-click menu, SwiftUI contextMenu]
  descriptors: [appears at pointer, actions for the clicked item]
  avoid: [pull-down-menu]
  coding: null
  image: null
status: draft
