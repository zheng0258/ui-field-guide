id: popup-select
kind: component
name: { en: Pop-up select, zh: 彈出式選擇 }
aliases: [dropdown, select, picker, 下拉選單, 下拉]
describe:
  - 點開後選一個值，按鈕上會顯示目前選的那個
  - 一顆按鈕，右邊有上下箭頭，點開是選項清單
category: input
confusedWith: [pull-down-menu, combobox]
platforms:
  macos:
    name: Pop-up button
    api: { appkit: NSPopUpButton, swiftui: 'Picker(.menu)' }
    guideline: https://developer.apple.com/design/human-interface-guidelines/pop-up-buttons
    states: [default, hover, pressed, focus, disabled]
    sizes: [mini, small, regular, large]
    demo: true
  ios:
    name: Pop-up button
    api: { uikit: 'UIButton (changesSelectionAsPrimaryAction)', swiftui: 'Picker(.menu)' }
    guideline: https://developer.apple.com/design/human-interface-guidelines/pop-up-buttons
  android:
    name: Exposed dropdown menu
    api: { compose: ExposedDropdownMenuBox, view: MaterialAutoCompleteTextView }
    guideline: https://m3.material.io/components/menus/overview
  web:
    name: Select
    api: { html: '<select>', aria: 'combobox (Select-Only)' }
    guideline: https://www.w3.org/WAI/ARIA/apg/patterns/combobox/
prompt:
  keywords: [macOS pop-up button, NSPopUpButton, SwiftUI Picker menu style]
  descriptors: [shows current selection, up-down chevron on right]
  avoid: [pull-down-menu]
  coding: null
  image: null
status: draft
